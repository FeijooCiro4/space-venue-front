@if (space.isLoading()) {
  <p>Cargando...</p>
} @else if (space.error()) {
  <p>No se pudo cargar el espacio</p>
} @else if (space.value(); as s) {
    <div class="spaceDetail">
        <p>{{space.value()?.idSpace}}</p>
        <p>{{space.value()?.nameSpace}}</p>
        <p>{{space.value()?.description}}</p>   
    </div>
    <a routerLink="/espacios">Volver a la lista (provisorio para mejor experiencia durante testeo)</a>

}
